name: ddg canary

# The keyless search path parses an HTML page nobody promised us. Check it on a
# schedule so a DuckDuckGo markup change surfaces here rather than in a user's
# terminal. This is the only job that touches the network.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: parse live DuckDuckGo
        run: node --test dist/canary/ddg.live.test.js

      - name: open an issue if the parser broke
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "DuckDuckGo result parsing is failing";
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "canary",
            });
            if (data.some((issue) => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["canary", "bug"],
              body: [
                "The scheduled canary could not parse results from live DuckDuckGo.",
                "",
                "That means `web_search` is returning the *possibly throttled* message",
                "to users on the keyless path. The regexes in `src/tools/web.ts`",
                "likely need updating, and `test/fixtures/duckduckgo.html` should be",
                "re-saved from a current response.",
                "",
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join("\n"),
            });
